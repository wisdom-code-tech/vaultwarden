name: 构建最新 Vaultwarden FPK

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "指定 Vaultwarden 版本；留空则使用上游最新稳定版"
        required: false
        type: string
      force:
        description: "覆盖同版本、同打包修订的 Release 资产"
        required: false
        default: false
        type: boolean
      stable:
        description: "发布不带 rc 后缀的正式版"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: vaultwarden-fpk-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      package_version: ${{ steps.release.outputs.package_version }}
      release_channel: ${{ steps.release.outputs.release_channel }}
      tag: ${{ steps.release.outputs.tag }}
      release_exists: ${{ steps.release.outputs.release_exists }}
      should_build: ${{ steps.release.outputs.should_build }}
      make_latest: ${{ steps.release.outputs.make_latest }}
    steps:
      - name: 检出打包仓库
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 确定上游版本和发布状态
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          FORCE_BUILD: ${{ inputs.force }}
          STABLE_RELEASE: ${{ inputs.stable }}
        run: |
          python3 -m unittest discover -s scripts -p '*_test.py'
          python3 scripts/plan-release.py

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 检出打包仓库
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.mod

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick jq file

      - name: 注入版本
        run: |
          chmod +x scripts/*.sh packaging/vaultwarden/cmd/*
          ./scripts/prepare-release.sh \
            "${{ needs.check.outputs.version }}" \
            "${{ needs.check.outputs.revision }}" \
            "${{ needs.check.outputs.release_channel }}"

      - name: 构建并校验 FPK
        env:
          VAULTWARDEN_VERSION: ${{ needs.check.outputs.version }}
          VAULTWARDEN_AMD64_MANIFEST: ""
        run: make build

      - name: 验证生命周期降权与升级助手部署
        run: sudo bash scripts/test-lifecycle.sh

      - name: 生成发布资产
        env:
          PACKAGE_VERSION: ${{ needs.check.outputs.package_version }}
        run: |
          set -euo pipefail
          asset="dist/vaultwarden-${PACKAGE_VERSION}-fnos.fpk"
          mv dist/vaultwarden.fpk "${asset}"
          checksum="$(sha256sum "${asset}" | awk '{print $1}')"
          printf '%s  %s\n' "${checksum}" "$(basename "${asset}")" > dist/SHA256SUMS

      - name: 保存构建产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vaultwarden-${{ needs.check.outputs.package_version }}-fnos
          path: |
            dist/*.fpk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PACKAGE_VERSION: ${{ needs.check.outputs.package_version }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.check.outputs.release_channel }}
          RELEASE_EXISTS: ${{ needs.check.outputs.release_exists }}
          MAKE_LATEST: ${{ needs.check.outputs.make_latest }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          {
            echo "Vaultwarden ${VERSION} 的飞牛 fnOS 原生 FPK（包版本 ${PACKAGE_VERSION}）。"
            echo
            echo "- 上游版本：https://github.com/dani-garcia/vaultwarden/releases/tag/${VERSION}"
            echo "- 架构：x86_64"
            echo "- 运行期不依赖 Docker"
            echo "- 安装前请校验 SHA256SUMS"
            echo "- 上游程序版本：${VERSION}；fnOS 包版本：${PACKAGE_VERSION}。"
            echo "- 使用三段数字 FPK 版本修复旧 RC 转正式版被判为相同或更高版本的问题。"
            echo "- 已安装旧 RC 或旧裸版本的用户，请在飞牛应用中心手动安装本包覆盖升级，无需卸载；首次迁移后使用新的包版本检查更新。"
          } > "${notes_file}"
          release_flags=("--latest=${MAKE_LATEST}")
          if [ "${RELEASE_CHANNEL}" = "rc" ]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--prerelease=false)
          fi
          if [ "${RELEASE_EXISTS}" = "true" ]; then
            gh release upload "${RELEASE_TAG}" dist/*.fpk dist/SHA256SUMS --clobber
            gh release edit "${RELEASE_TAG}" "${release_flags[@]}" --title "Vaultwarden ${VERSION} for fnOS（FPK ${PACKAGE_VERSION}）" --notes-file "${notes_file}"
          else
            gh release create "${RELEASE_TAG}" dist/*.fpk dist/SHA256SUMS \
              "${release_flags[@]}" --target "${GITHUB_SHA}" \
              --title "Vaultwarden ${VERSION} for fnOS（FPK ${PACKAGE_VERSION}）" --notes-file "${notes_file}"
          fi
